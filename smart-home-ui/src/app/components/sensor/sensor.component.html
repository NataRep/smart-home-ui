<div [ngClass]="['sensor', layoutType || '']">
  <div class="title">
    <div class="icon">
      <i class="fa-solid {{ itemData.icon | iconMapper }}"></i>
    </div>
    <div class="label">{{ itemData.label }}</div>
  </div>

  @if (itemData.type === 'sensor') {
    <div class="value">{{ itemData | sensorValue }}</div>
  }
</div>
