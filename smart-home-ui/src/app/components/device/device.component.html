<div class="device">
  <div class="title">
    @if(layoutType != 'singleDevice'){
      <div class="icon" [class.active]="toggler().state">
        <i class="fa-solid {{ itemData.icon | iconMapper}}" [class.active]="toggler().state"></i>
      </div>
    }

    <div class="label">{{ itemData.label }}</div>
  </div>
  @if(layoutType != 'singleDevice'){
    <app-toggle [toggler]="toggler()!" (toggleChange)="onToggleChange()"></app-toggle>
  }


</div>
